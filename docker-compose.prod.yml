version: '3.8'

services:
  # Django Backend (Production)
  django:
    build:
      context: ./django_api
      dockerfile: Dockerfile
    container_name: stencil_flow_django_prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,your-domain.com
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=stencil_flow_prod
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - CORS_ALLOWED_ORIGINS=https://your-domain.com,https://www.your-domain.com
      - CORS_ALLOW_ALL_ORIGINS=False
      - SITE_URL=https://your-domain.com
      - SERVER_URL=https://your-domain.com
    env_file:
      - ./django_api/.env.prod
    volumes:
      - django_static_prod:/app/staticfiles
      - django_media_prod:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stencil_flow_network_prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database (Production)
  postgres:
    image: postgres:15-alpine
    container_name: stencil_flow_postgres_prod
    restart: unless-stopped
    environment:
      - POSTGRES_DB=stencil_flow_prod
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./database_schema_update.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    networks:
      - stencil_flow_network_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stencil_flow_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Production)
  redis:
    image: redis:7-alpine
    container_name: stencil_flow_redis_prod
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - stencil_flow_network_prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx (Production)
  nginx:
    image: nginx:alpine
    container_name: stencil_flow_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - django_static_prod:/app/staticfiles:ro
      - django_media_prod:/app/media:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - django
    networks:
      - stencil_flow_network_prod

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  django_static_prod:
    driver: local
  django_media_prod:
    driver: local

networks:
  stencil_flow_network_prod:
    driver: bridge

