version: '3.8'

services:
  # Django Backend
  django:
    build:
      context: ./django_api
      dockerfile: Dockerfile
    container_name: stencil_flow_django
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=stencil_flow
      - DB_USER=postgres
      - DB_PASSWORD=postgres_password
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000
      - CORS_ALLOW_ALL_ORIGINS=False
      - SITE_URL=http://localhost:3000
      - SERVER_URL=http://localhost:8000
    env_file:
      - ./django_api/.env
    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stencil_flow_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: stencil_flow_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=stencil_flow
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_schema_update.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    networks:
      - stencil_flow_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stencil_flow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for caching and session storage)
  redis:
    image: redis:7-alpine
    container_name: stencil_flow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stencil_flow_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx (optional - for production)
  nginx:
    image: nginx:alpine
    container_name: stencil_flow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - django_static:/app/staticfiles:ro
      - django_media:/app/media:ro
    depends_on:
      - django
    networks:
      - stencil_flow_network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  django_static:
    driver: local
  django_media:
    driver: local

networks:
  stencil_flow_network:
    driver: bridge

